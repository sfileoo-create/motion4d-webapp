<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Редактирование новости</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #999999);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    padding: 16px;
    padding-bottom: 32px;
  }
  .label {
    font-size: 13px;
    color: var(--hint);
    margin-bottom: 8px;
  }
  .field {
    margin-bottom: 16px;
  }
  .preview-img {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 16px;
    display: none;
    background: var(--secondary-bg);
  }
  input[type="text"], textarea {
    width: 100%;
    background: var(--secondary-bg);
    color: var(--text);
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 16px;
    line-height: 1.4;
    font-family: inherit;
  }
  input[type="text"] {
    height: 44px;
  }
  textarea {
    height: var(--textarea-height, 240px);
    resize: vertical;
  }
  input:focus, textarea:focus {
    outline: 2px solid var(--button);
  }
  .counter {
    text-align: right;
    font-size: 12px;
    color: var(--hint);
    margin-top: 6px;
  }
  .counter.over {
    color: #e05353;
  }
  .fallback {
    text-align: center;
    padding: 40px 16px;
    color: var(--hint);
  }
  .save-fallback {
    margin-top: 8px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--button);
    color: var(--button-text);
    font-size: 16px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div id="app">
  <img class="preview-img" id="previewImg" alt="">

  <div class="field">
    <div class="label">Заголовок:</div>
    <input type="text" id="title" maxlength="120">
  </div>

  <div class="field">
    <div class="label">Текст новости:</div>
    <textarea id="text" maxlength="1200"></textarea>
    <div class="counter" id="counter">0 / 1000</div>
  </div>

  <div class="field">
    <div class="label">Хэштеги (тематические, через пробел — канал добавится отдельно):</div>
    <input type="text" id="hashtags" maxlength="120">
  </div>

  <button class="save-fallback" id="saveFallback" style="display:none;">Сохранить</button>
</div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;

  // Фиксируем высоту текстового поля один раз при загрузке (до открытия
  // системной клавиатуры) — используем viewportStableHeight, если
  // доступен, он не учитывает клавиатуру в отличие от viewportHeight.
  var stableHeight = (tg && tg.viewportStableHeight) || window.innerHeight;
  document.documentElement.style.setProperty("--textarea-height", Math.round(stableHeight * 0.35) + "px");

  var params = new URLSearchParams(window.location.search);
  var newsId = params.get("news_id");

  function readParam(name) {
    var v = params.get(name) || "";
    try { v = decodeURIComponent(v); } catch (e) {}
    return v;
  }

  var titleInput = document.getElementById("title");
  var textarea = document.getElementById("text");
  var hashtagsInput = document.getElementById("hashtags");
  var counter = document.getElementById("counter");
  var previewImg = document.getElementById("previewImg");
  var SOFT_LIMIT = 1000;

  titleInput.value = readParam("title");
  textarea.value = readParam("text");
  hashtagsInput.value = readParam("hashtags");

  var imageUrl = readParam("image");
  if (imageUrl) {
    previewImg.src = imageUrl;
    previewImg.style.display = "block";
    previewImg.addEventListener("error", function () {
      previewImg.style.display = "none";
    });
  }

  function updateCounter() {
    var len = textarea.value.length;
    counter.textContent = len + " / " + SOFT_LIMIT;
    counter.className = "counter" + (len > SOFT_LIMIT ? " over" : "");
  }
  textarea.addEventListener("input", updateCounter);
  updateCounter();

  function doSave() {
    var text = textarea.value.trim();
    if (!text || !newsId) return;
    var payload = JSON.stringify({
      news_id: newsId,
      text: text,
      title: titleInput.value.trim(),
      hashtags: hashtagsInput.value.trim(),
    });
    if (tg) {
      tg.sendData(payload);
    } else {
      alert("Открыто вне Telegram — сохранение недоступно.");
    }
  }

  if (tg) {
    tg.ready();
    tg.expand();
    tg.MainButton.setText("Сохранить");
    tg.MainButton.show();
    tg.MainButton.onClick(doSave);
  } else {
    document.getElementById("saveFallback").style.display = "block";
    document.getElementById("saveFallback").addEventListener("click", doSave);
  }
})();
</script>

</body>
</html>
